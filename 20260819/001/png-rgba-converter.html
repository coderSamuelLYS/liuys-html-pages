<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>一键转真 PNG</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: #f4f1ea;
      color: #222;
    }
    main {
      width: min(520px, 92vw);
      background: #fff;
      border: 1px solid #ddd4c4;
      padding: 32px 28px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }
    p { margin: 0 0 22px; color: #666; font-size: 14px; line-height: 1.6; }
    .drop {
      display: block;
      border: 1px dashed #b9ae9a;
      padding: 48px 16px;
      text-align: center;
      cursor: pointer;
      color: #555;
      background: #faf8f3;
    }
    .drop:hover { border-color: #222; color: #222; }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      border: 0;
      background: #222;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    .ok { margin-top: 12px; font-size: 13px; color: #2f6b3a; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1>一键转真 PNG</h1>
    <p>选一张图，点下载。只做格式转换，画面不变，文件不会上传。</p>
    <label class="drop">
      <span id="hint">点击或拖入图片</span>
      <input id="file" type="file" accept="image/*" hidden />
    </label>
    <button id="download" disabled>下载 PNG</button>
    <div class="ok" id="status"></div>
  </main>
  <script>
    let blob = null;
    let name = "image";
    const hint = document.getElementById("hint");
    const status = document.getElementById("status");
    const download = document.getElementById("download");

    function convert(file) {
      name = file.name.replace(/\.[^.]+$/, "") || "image";
      hint.textContent = file.name;
      status.textContent = "转换中…";
      download.disabled = true;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext("2d").drawImage(img, 0, 0);
        canvas.toBlob((b) => {
          blob = b;
          download.disabled = !b;
          status.textContent = b ? "已转成真 PNG，可以下载" : "转换失败";
          URL.revokeObjectURL(url);
        }, "image/png");
      };
      img.onerror = () => { status.textContent = "读图失败"; };
      img.src = url;
    }

    document.querySelector(".drop").addEventListener("click", () => {
      document.getElementById("file").click();
    });
    document.getElementById("file").onchange = (e) => {
      if (e.target.files[0]) convert(e.target.files[0]);
    };
    document.querySelector("main").addEventListener("dragover", (e) => e.preventDefault());
    document.querySelector("main").addEventListener("drop", (e) => {
      e.preventDefault();
      if (e.dataTransfer.files[0]) convert(e.dataTransfer.files[0]);
    });
    download.onclick = () => {
      if (!blob) return;
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = name + ".png";
      a.click();
    };
  </script>
</body>
</html>
